name: Temp FinanceOS APK Transfer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode encrypted payload
        shell: bash
        run: base64 -d tmp-financeos-apk-transfer-20261012.enc.b64 > apk_transfer.enc
      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: financeos-apk-transfer
          path: apk_transfer.enc
          retention-days: 1
